[project]
name = "agent"
version = "0.1.0"
description = "Local research agent with an embedded RAG subsystem."
authors = [{ name = "Minervamuses" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "chromadb (>=1.5.0,<2.0.0)",
    "httpx (>=0.27,<1.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "langchain-core (>=1.2.0,<2.0.0)",
    "langchain-mcp-adapters (>=0.2.2,<0.3.0)",
    "langchain-ollama (>=1.0.0,<2.0.0)",
    "langgraph (>=1.1.4,<2.0.0)",
    "openai (>=2.30.0,<3.0.0)",
    "pybtex (>=0.26.1,<0.27)",
    "pydantic (>=2.0,<3.0)",
    "prompt-toolkit (>=3.0.52,<4.0.0)",
    "pyyaml (>=6.0,<7.0)",
    "tiktoken (>=0.12.0,<0.13.0)",
    "typing-extensions (>=4.0,<5.0)",
    "langchain-openrouter (==0.2.6)",
]

[tool.poetry]
packages = [{ include = "agent" }, { include = "rag" }, { include = "skills" }]
include = [
    { path = "tool/_internal/extension-management/SKILL.md", format = ["sdist", "wheel"] },
    { path = "tool/local/README.md", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"
