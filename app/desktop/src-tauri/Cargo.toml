[package]
name = "research-agent-desktop"
version = "0.1.0"
description = "Local desktop interface for the research agent"
authors = ["Minervamuses"]
edition = "2021"

[lib]
name = "research_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
